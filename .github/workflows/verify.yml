name: verify

# Three gates, in the order that fails cheapest first. The glyph check runs on
# source and needs no build; the link check needs dist, so it runs after.
#
# The glyph check IS a hard gate. It is mechanical - a table, not judgement -
# it stands at zero findings, and it catches the one failure the marks can
# still have now that they come from lucide: a slug lucide does not ship, or a
# GlyphName with no icon behind it. Both reach the page as an empty box.

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Mark table
        run: node scripts/check-glyphs.mjs

      - name: Build
        run: npm run build

      - name: Internal links
        run: node scripts/check-links.mjs
