name: verify

# Build, then check every internal link in the output. The build itself is the
# stricter gate: it pulls the docs from the newest stable svipall tag (CI is
# set, so scripts/sync-docs.mjs never reads a local checkout) and Starlight's
# links validator fails it on any docs link that does not resolve.

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run build
        env:
          # The home asks the GitHub API for the product's newest stable
          # release and writes it into the nav. Anonymous callers get sixty
          # requests an hour per IP and a CI runner shares its IP widely, so
          # the build is authenticated. Without a token the request may simply
          # not answer, and the build then ships no version rather than a wrong one.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Internal links
        run: node scripts/check-links.mjs
